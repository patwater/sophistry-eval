[project]
name = "sophistry-eval"
version = "0.1.0"
description = "Scores writing on persuasive force, conceptual integrity and difficulty of the case."
requires-python = ">=3.12"
dependencies = ["anthropic"]

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sophistry_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: end-to-end tests with a known right answer, which may call a live model",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "checks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PT", "ANN", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
